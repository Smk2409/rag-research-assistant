AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Cloud-Based AI Research Assistant (RAG) v2 - S3, Lambda, Bedrock, Textract, DynamoDB,
  Cognito, API Gateway, CloudFront, CloudWatch

Parameters:
  ProjectName:
    Type: String
    Default: rag-research-assistant
    AllowedPattern: '^[a-z0-9-]{3,30}$'
    Description: Lowercase name; used to build globally-unique bucket names
  GenerationModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
    Description: Bedrock model or inference-profile ID for answers (must be enabled in your account/region)
  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
  TopK:
    Type: Number
    Default: 5
  EnableOcr:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Use Amazon Textract for scanned PDFs
  AlertEmail:
    Type: String
    Default: ''
    Description: Optional e-mail for CloudWatch error alarms

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    CodeUri: src/
    MemorySize: 1024
    Timeout: 25
    Tracing: Active
    Environment:
      Variables:
        BUCKET_NAME: !Sub '${ProjectName}-docs-${AWS::AccountId}-${AWS::Region}'
        TABLE_NAME: !Ref DocumentsTable
        ACTIVITY_TABLE: !Ref ActivityTable
        EMBEDDING_MODEL_ID: !Ref EmbeddingModelId
        GENERATION_MODEL_ID: !Ref GenerationModelId
        TOP_K: !Ref TopK
        ENABLE_OCR: !Ref EnableOcr

Resources:
  # ============ STORAGE ============
  DocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-docs-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Suspended}
      CorsConfiguration:
        CorsRules:
          - {AllowedMethods: [POST], AllowedOrigins: ['*'], AllowedHeaders: ['*'], MaxAge: 3000}

  # One row per document (userId / docId)
  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      AttributeDefinitions:
        - {AttributeName: userId, AttributeType: S}
        - {AttributeName: docId, AttributeType: S}
      KeySchema:
        - {AttributeName: userId, KeyType: HASH}
        - {AttributeName: docId, KeyType: RANGE}

  # Single-table design: SESSION#, MSG#, FB#, JOB# items (userId / sk)
  ActivityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: userId, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: userId, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

  # ============ AUTH ============
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-users'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms: [{Name: verified_email, Priority: 1}]
      Policies:
        PasswordPolicy: {MinimumLength: 8, RequireLowercase: true, RequireUppercase: true, RequireNumbers: true, RequireSymbols: false}

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]

  # ============ API ============
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings: {ThrottlingBurstLimit: 50, ThrottlingRateLimit: 25}
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: [Authorization, Content-Type]
        AllowMethods: [GET, POST, DELETE, OPTIONS]
      Auth:
        DefaultAuthorizer: CognitoAuth
        Authorizers:
          CognitoAuth:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience: [!Ref UserPoolClient]

  # ============ LAMBDA FUNCTIONS ============
  DocumentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.documents.handler
      Policies:
        - Statement:
            - {Effect: Allow, Action: [s3:PutObject, s3:GetObject, s3:DeleteObject], Resource: !Sub 'arn:aws:s3:::${ProjectName}-docs-${AWS::AccountId}-${AWS::Region}/*'}
            - {Effect: Allow, Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:Query, dynamodb:DeleteItem], Resource: !GetAtt DocumentsTable.Arn}
      Events:
        Upload: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /documents/upload-url, Method: POST}}
        List: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /documents, Method: GET}}
        Delete: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/documents/{docId}', Method: DELETE}}
        Url: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/documents/{docId}/url', Method: GET}}

  ProcessDocumentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.process_document.handler
      Timeout: 900
      MemorySize: 2048
      Policies:
        - Statement:
            - {Effect: Allow, Action: [s3:GetObject, s3:PutObject], Resource: !Sub 'arn:aws:s3:::${ProjectName}-docs-${AWS::AccountId}-${AWS::Region}/*'}
            - {Effect: Allow, Action: [dynamodb:UpdateItem], Resource: !GetAtt DocumentsTable.Arn}
            - {Effect: Allow, Action: [bedrock:InvokeModel], Resource: '*'}
            - {Effect: Allow, Action: [textract:StartDocumentTextDetection, textract:GetDocumentTextDetection], Resource: '*'}
      Events:
        FileUploaded:
          Type: S3
          Properties:
            Bucket: !Ref DocsBucket
            Events: s3:ObjectCreated:*
            Filter: {S3Key: {Rules: [{Name: prefix, Value: uploads/}]}}

  AskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.ask.handler
      Timeout: 29
      MemorySize: 1536
      Policies:
        - Statement:
            - {Effect: Allow, Action: [s3:GetObject], Resource: !Sub 'arn:aws:s3:::${ProjectName}-docs-${AWS::AccountId}-${AWS::Region}/vectors/*'}
            - {Effect: Allow, Action: [dynamodb:Query], Resource: !GetAtt DocumentsTable.Arn}
            - {Effect: Allow, Action: [dynamodb:Query, dynamodb:PutItem, dynamodb:UpdateItem], Resource: !GetAtt ActivityTable.Arn}
            - {Effect: Allow, Action: [bedrock:InvokeModel], Resource: '*'}
      Events:
        Ask: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /ask, Method: POST}}

  WorkspaceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.workspace.handler
      Policies:
        - Statement:
            - {Effect: Allow, Action: [dynamodb:Query, dynamodb:PutItem, dynamodb:BatchWriteItem, dynamodb:DeleteItem], Resource: !GetAtt ActivityTable.Arn}
            - {Effect: Allow, Action: [dynamodb:Query], Resource: !GetAtt DocumentsTable.Arn}
      Events:
        Chats: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /chats, Method: GET}}
        Chat: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/chats/{sessionId}', Method: GET}}
        DeleteChat: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/chats/{sessionId}', Method: DELETE}}
        Feedback: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /feedback, Method: POST}}
        Stats: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /stats, Method: GET}}

  StudyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.study_api.handler
      Environment:
        Variables:
          WORKER_NAME: !Ref StudyWorkerFunction
      Policies:
        - Statement:
            - {Effect: Allow, Action: [dynamodb:GetItem], Resource: !GetAtt DocumentsTable.Arn}
            - {Effect: Allow, Action: [dynamodb:PutItem, dynamodb:GetItem], Resource: !GetAtt ActivityTable.Arn}
            - {Effect: Allow, Action: [lambda:InvokeFunction], Resource: !GetAtt StudyWorkerFunction.Arn}
      Events:
        Start: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /study, Method: POST}}
        Poll: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/study/{jobId}', Method: GET}}

  # Long-running study jobs run asynchronously (API Gateway HTTP API has a 30 s limit)
  StudyWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.study_worker.handler
      Timeout: 300
      MemorySize: 1536
      Policies:
        - Statement:
            - {Effect: Allow, Action: [s3:GetObject], Resource: !Sub 'arn:aws:s3:::${ProjectName}-docs-${AWS::AccountId}-${AWS::Region}/vectors/*'}
            - {Effect: Allow, Action: [dynamodb:UpdateItem], Resource: !GetAtt ActivityTable.Arn}
            - {Effect: Allow, Action: [bedrock:InvokeModel], Resource: '*'}

  # ============ FRONTEND HOSTING ============
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig: {OriginAccessIdentity: ''}
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad            # CachingDisabled
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # SecurityHeadersPolicy

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # ============ MONITORING ============
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription: !If [HasAlertEmail, [{Protocol: email, Endpoint: !Ref AlertEmail}], !Ref 'AWS::NoValue']

  AskErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Ask Lambda is failing
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref AskFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  ProcessErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Document processing is failing
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref ProcessDocumentFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${ProjectName}-dashboard'
      DashboardBody: !Sub |
        {"widgets":[
          {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"Lambda invocations","region":"${AWS::Region}","stat":"Sum","period":300,
            "metrics":[["AWS/Lambda","Invocations","FunctionName","${AskFunction}"],["...","${ProcessDocumentFunction}"],["...","${StudyWorkerFunction}"],["...","${DocumentsFunction}"]]}},
          {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"Lambda errors","region":"${AWS::Region}","stat":"Sum","period":300,
            "metrics":[["AWS/Lambda","Errors","FunctionName","${AskFunction}"],["...","${ProcessDocumentFunction}"],["...","${StudyWorkerFunction}"]]}},
          {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"Ask latency (ms, p90)","region":"${AWS::Region}","stat":"p90","period":300,
            "metrics":[["AWS/Lambda","Duration","FunctionName","${AskFunction}"]]}},
          {"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{"title":"API 4xx / 5xx","region":"${AWS::Region}","stat":"Sum","period":300,
            "metrics":[["AWS/ApiGateway","4xx","ApiId","${Api}"],["AWS/ApiGateway","5xx","ApiId","${Api}"]]}}
        ]}

Outputs:
  ApiUrl: {Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'}
  UserPoolId: {Value: !Ref UserPool}
  UserPoolClientId: {Value: !Ref UserPoolClient}
  FrontendBucketName: {Value: !Ref FrontendBucket}
  DocsBucketName: {Value: !Ref DocsBucket}
  WebsiteUrl: {Value: !Sub 'https://${Distribution.DomainName}'}
  DashboardName: {Value: !Sub '${ProjectName}-dashboard'}
